[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "apollo-rag"
version = "0.1.0"
description = "Private, traceable Apollo ERP corpus preparation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "chromadb-client==1.5.9",
    "numpy==2.3.4",
    "httpx==0.28.1",
    "transformers==4.57.1",
]

[dependency-groups]
dev = ["pytest==8.4.2"]

[project.scripts]
apollo-rag = "apollo_rag.cli:main"

[tool.setuptools.packages.find]
include = ["apollo_rag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires the real E5 tokenizer cached locally"]
